services:
  - type: web
    name: betnova-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: HOUSE_EDGE
        value: "2"
      - key: CRASH_HASH_SEED
        sync: false
